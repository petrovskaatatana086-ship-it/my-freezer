<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScandiFreeze">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/snowflake.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/snowflake.png">
    <meta name="theme-color" content="#3b82f6">
    <title>Scandi Freeze — Умный холодильник</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; padding-bottom: 100px; overflow-y: auto; overflow-x: hidden; position: relative; width: 100%; }
        .scandi-card { background: white; border-radius: 1.25rem; border: 1px solid #f1f5f9; transition: background 0.1s ease; }
        .scandi-card:active { background-color: #f8fafc; transform: none; }
        .category-pill { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.9rem; border-radius: 2rem; font-size: 9px; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; margin-bottom: 0.75rem; cursor: pointer; transition: opacity 0.1s; user-select: none; }
        .category-pill:active { opacity: 0.7; transform: none; }
        .pill-meat { background-color: #fee2e2; color: #b91c1c; }
        .pill-chicken { background-color: #ffedd5; color: #9a3412; }
        .pill-fish { background-color: #e0f2fe; color: #075985; }
        .pill-veg { background-color: #dcfce7; color: #166534; }
        .pill-fruits { background-color: #fef3c7; color: #92400e; }
        .pill-greens { background-color: #f0fdf4; color: #15803d; }
        .pill-pf { background-color: #fef9c3; color: #854d0e; }
        .pill-bakery { background-color: #fafaf9; color: #44403c; }
        .pill-cookery { background-color: #f3e8ff; color: #6b21a8; }
        .pill-other { background-color: #f1f5f9; color: #475569; }
        .collapsed-category .category-products { display: none; }
        .category-toggle-icon { font-size: 10px; margin-left: 4px; transition: transform 0.2s; }
        .collapsed-category .category-toggle-icon { transform: rotate(-90deg); }
        .tab-bar { background: rgba(255,255,255,0.96); backdrop-filter: blur(20px); border-top: 1px solid #f1f5f9; padding-bottom: env(safe-area-inset-bottom); }
        .fab { background: #3b82f6; box-shadow: 0 8px 18px -4px rgba(59,130,246,0.4); }
        .fab:active { opacity: 0.8; transform: none; }
        .modal-sheet { background: white; border-radius: 2rem 2rem 0 0; transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); transform: translateY(100%); box-shadow: 0 -8px 30px rgba(0,0,0,0.08); }
        .modal-active { transform: translateY(0) !important; }
        .compact-input { border-bottom: 2px solid #e2e8f0; transition: border-color 0.2s; border-radius: 0; }
        .compact-input:focus { border-color: #3b82f6; outline: none; }
        .day-card { border-left: 4px solid #3b82f6; }
        .toast-message { position: fixed; bottom: 100px; left: 20px; right: 20px; background: #1e293b; color: white; text-align: center; padding: 10px; border-radius: 60px; font-size: 12px; font-weight: 600; z-index: 200; transition: opacity 0.2s; opacity: 0; pointer-events: none; }
        .voice-active { animation: pulse-red 1.2s infinite; background-color: #fee2e2 !important; color: #ef4444 !important; }
        @keyframes pulse-red { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(239,68,68,0); } 100% { transform: scale(1); } }
        .stat-card { background: white; border-radius: 1.5rem; border: 1px solid #f1f5f9; }
        button:active { transform: none; opacity: 0.7; }
        .search-wrapper { position: relative; margin-bottom: 1rem; margin-top: 0.25rem; }
        .search-input { background: white; border-radius: 2rem; padding: 0.6rem 2rem 0.6rem 1rem; font-size: 0.85rem; border: 1px solid #e2e8f0; width: 100%; outline: none; transition: border 0.2s; }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
        .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: #e2e8f0; border-radius: 999px; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; color: #475569; transition: 0.1s; }
        .search-clear:active { background: #cbd5e1; transform: translateY(-50%) scale(0.95); }
        .inventory-header { display: flex; justify-content: space-between; align-items: baseline; padding: 0.5rem 0.75rem 0.25rem 0.75rem; border-bottom: 1px solid #f1f5f9; }
        .product-name { font-weight: 800; font-size: 0.9rem; }
        .total-badge { font-size: 0.7rem; font-weight: 800; background: #f1f5f9; padding: 0.2rem 0.6rem; border-radius: 1rem; white-space: nowrap; }
        .single-location-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0.75rem; }
        .multi-location-row { display: flex; justify-content: space-between; align-items: center; padding: 0.4rem 0.75rem; border-top: 1px solid #f8fafc; }
        .loc-icon { width: 1rem; height: 1rem; color: #94a3b8; }
        .action-btn { padding: 0.3rem; border-radius: 0.6rem; background: white; border: 1px solid #e2e8f0; color: #64748b; }
        .action-btn-blue { background: #eff6ff; border: none; color: #2563eb; }
        .copy-btn { background: #fefce8; border: 1px solid #fde047; color: #854d0e; }
        .move-btn { background: #e0f2fe; border: none; color: #0284c7; }
        main { min-height: 60vh; }
        input, select, textarea { font-size: 16px; }
    </style>
</head>
<body>

<div id="toast" class="toast-message"></div>

<header class="px-6 pt-10 pb-3 sticky top-0 bg-[#f8fafc]/90 backdrop-blur-md z-30">
    <div class="flex justify-between items-center">
        <div><span id="dateDisplay" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Сегодня</span><h1 id="pageTitle" class="text-2xl font-black tracking-tight text-slate-900">Запасы</h1></div>
        <button onclick="openAddModal()" class="fab w-12 h-12 rounded-xl flex items-center justify-center text-white shadow-md"><i data-lucide="plus" class="w-5 h-5"></i></button>
    </div>
</header>

<main id="mainContent" class="px-6 pb-32"></main>

<nav class="fixed bottom-0 left-0 right-0 tab-bar h-24 px-2 flex justify-around items-center z-40">
    <button onclick="switchTab('inventory')" class="flex flex-col items-center gap-1 flex-1 transition-all text-blue-600" id="btnInv"><i data-lucide="package" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase tracking-tighter">Запасы</span></button>
    <button onclick="switchTab('plan')" class="flex flex-col items-center gap-1 flex-1 opacity-40 transition-all" id="btnPlan"><i data-lucide="calendar-check" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase tracking-tighter">Меню</span></button>
    <button onclick="switchTab('shopping')" class="flex flex-col items-center gap-1 flex-1 opacity-40 transition-all" id="btnShop"><i data-lucide="shopping-bag" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase tracking-tighter">Купить</span></button>
    <button onclick="switchTab('history')" class="flex flex-col items-center gap-1 flex-1 opacity-40 transition-all" id="btnHist"><i data-lucide="pie-chart" class="w-5 h-5"></i><span class="text-[9px] font-bold uppercase tracking-tighter">Аналитика</span></button>
</nav>

<div id="modalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden transition-all" onclick="closeAllModals()"></div>

<!-- Модалка товара -->
<div id="itemModal" class="modal-sheet fixed bottom-0 left-0 right-0 z-[60] p-6 max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-5"></div>
    <div class="space-y-5 pb-8">
        <input type="hidden" id="editItemId">
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Название</label><div class="flex gap-2"><input type="text" id="itemName" class="compact-input flex-1 py-2 text-lg font-bold" placeholder="Куриное филе"><button id="voiceBtn" onclick="startVoiceRecognition()" class="p-2 bg-slate-50 rounded-lg"><i data-lucide="mic" class="w-4 h-4"></i></button></div></div>
        <div class="grid grid-cols-2 gap-4"><div><label class="text-[9px] font-bold text-slate-400 ml-1">Количество</label><input type="number" id="itemQty" step="0.1" class="compact-input w-full py-2 text-xl font-black text-blue-600"></div><div><label class="text-[9px] font-bold text-slate-400 ml-1">Мин. порог</label><input type="number" id="itemMinQty" step="0.1" value="1" class="compact-input w-full py-2 text-xl font-black text-red-400"></div></div>
        <div class="grid grid-cols-2 gap-4"><div><label class="text-[9px] font-bold text-slate-400 ml-1">Ед. изм.</label><select id="itemUnit" class="compact-input w-full py-2 font-bold"><option value="шт">шт</option><option value="кг">кг</option><option value="г">г</option><option value="мл">мл</option><option value="л">л</option><option value="уп">уп</option></select></div><div><label class="text-[9px] font-bold text-slate-400 ml-1">Категория</label><select id="itemCat" class="compact-input w-full py-2 font-bold"><option value="мясо">🥩 Мясо</option><option value="курица">🍗 Курица</option><option value="рыба">🐟 Рыба</option><option value="овощи">🥦 Овощи</option><option value="фрукты">🍎 Фрукты</option><option value="п/ф">🥟 П/Ф</option><option value="выпечка">🥐 Выпечка</option><option value="кулинария">🥗 Кулинария</option><option value="зелень">🌿 Зелень</option><option value="другое">📦 Разное</option></select></div></div>
        <div class="grid grid-cols-2 gap-4"><div><label class="text-[9px] font-bold text-slate-400 ml-1">Локация</label><select id="itemLoc" class="compact-input w-full py-2 font-bold"><option value="Дом">🏠 Дом</option><option value="Сарай ст.">🏚 Сарай ст.</option><option value="Сарай н.">🏢 Сарай н.</option></select></div><div><label class="text-[9px] font-bold text-slate-400 ml-1">Годен (дн)</label><input type="number" id="itemShelfLife" value="90" class="compact-input w-full py-2 font-bold"></div></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Дата заморозки</label><input type="date" id="itemDate" class="compact-input w-full py-2"></div>
        <div class="flex gap-3 pt-2">
            <button id="deleteBtn" onclick="deleteCurrentItem()" class="flex-1 py-3 bg-red-50 text-red-600 rounded-xl font-black text-[10px] uppercase">Удалить</button>
            <button id="copyBtnModal" onclick="copyCurrentItem()" class="flex-1 py-3 bg-amber-50 text-amber-700 rounded-xl font-black text-[10px] uppercase">Копировать</button>
            <button onclick="saveItem()" class="flex-[2] py-3 bg-slate-900 text-white rounded-xl font-black text-[10px] uppercase">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модалка планирования -->
<div id="planModal" class="modal-sheet fixed bottom-0 left-0 right-0 z-[60] p-6 max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-5"></div>
    <h2 class="text-lg font-bold mb-3">Запланировать</h2>
    <div class="space-y-4">
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">День</label><select id="planDay" class="compact-input w-full py-2 font-bold"><option value="Понедельник">Понедельник</option><option value="Вторник">Вторник</option><option value="Среда">Среда</option><option value="Четверг">Четверг</option><option value="Пятница">Пятница</option><option value="Суббота">Суббота</option><option value="Воскресенье">Воскресенье</option></select></div>
        <div id="planSource"></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Списать</label><div class="flex gap-2"><input type="number" id="planQtyDeduct" step="0.1" class="compact-input flex-1 py-2 text-xl font-black text-blue-600"><span id="planUnitLabel" class="self-end pb-1 font-bold text-slate-400 text-xs">ед</span></div><div id="stockWarning" class="text-[10px] text-red-500 hidden mt-1">Недостаточно</div></div>
        <button onclick="confirmAddToPlan()" class="w-full py-4 bg-blue-600 text-white rounded-xl font-black text-[10px] uppercase shadow-md">Запланировать и списать</button>
    </div>
</div>

<!-- Модалка перемещения продукта (исправлена) -->
<div id="moveModal" class="modal-sheet fixed bottom-0 left-0 right-0 z-[60] p-6 max-h-[90vh] overflow-y-auto">
    <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto mb-5"></div>
    <h2 class="text-lg font-bold mb-3">Переместить продукт</h2>
    <div class="space-y-4">
        <input type="hidden" id="moveItemId">
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Продукт</label><p id="moveProductName" class="font-bold text-base py-1"></p></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Из локации</label><p id="moveFromLoc" class="font-medium py-1 text-sm"></p></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Доступно</label><p id="moveAvailableQty" class="font-black text-blue-600 text-xl"></p></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">Количество для переноса</label><input type="number" id="moveQty" step="0.1" class="compact-input w-full py-2 text-xl font-black text-blue-600"></div>
        <div><label class="text-[9px] font-bold text-slate-400 ml-1">В локацию</label><select id="moveTargetLoc" class="compact-input w-full py-2 font-bold"><option value="Дом">🏠 Дом</option><option value="Сарай ст.">🏚 Сарай ст.</option><option value="Сарай н.">🏢 Сарай н.</option></select></div>
        <div class="flex gap-3 pt-2">
            <button onclick="closeAllModals()" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-black text-[10px] uppercase">Отмена</button>
            <button onclick="moveAllQuantity()" class="flex-1 py-3 bg-sky-100 text-sky-700 rounded-xl font-black text-[10px] uppercase">Переместить всё</button>
            <button onclick="confirmMove()" class="flex-1 py-3 bg-sky-600 text-white rounded-xl font-black text-[10px] uppercase">Переместить</button>
        </div>
    </div>
</div>

<input type="file" id="importInput" class="hidden" accept=".json" onchange="handleImport(event)">

<script>
    let inventory = JSON.parse(localStorage.getItem('scandi_stocks_v9')) || [];
    let historyData = JSON.parse(localStorage.getItem('scandi_history_v9')) || [];
    let menuPlan = JSON.parse(localStorage.getItem('scandi_menu_v9')) || {};
    let currentTab = 'inventory';
    let pendingPlanItemId = null;
    let inventorySearchQuery = '';
    let collapsedCategories = JSON.parse(localStorage.getItem('scandi_collapsed_cats')) || {};

    const categoriesMap = { мясо:'pill-meat', курица:'pill-chicken', рыба:'pill-fish', овощи:'pill-veg', фрукты:'pill-fruits', 'п/ф':'pill-pf', выпечка:'pill-bakery', кулинария:'pill-cookery', зелень:'pill-greens', другое:'pill-other' };
    const categoryOrder = ['мясо','курица','рыба','овощи','фрукты','п/ф','зелень','выпечка','кулинария','другое'];
    const daysOrder = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.style.background = isError ? '#ef4444' : '#1e293b';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    function save() {
        localStorage.setItem('scandi_stocks_v9', JSON.stringify(inventory));
        localStorage.setItem('scandi_history_v9', JSON.stringify(historyData));
        localStorage.setItem('scandi_menu_v9', JSON.stringify(menuPlan));
        localStorage.setItem('scandi_collapsed_cats', JSON.stringify(collapsedCategories));
    }

    function cleanupOrphanPlanItems() {
        let changed = false;
        for (let day in menuPlan) {
            const original = menuPlan[day]?.length || 0;
            menuPlan[day] = (menuPlan[day] || []).filter(p => inventory.some(i => i.id === p.itemId));
            if (menuPlan[day].length !== original) changed = true;
            if (menuPlan[day].length === 0) delete menuPlan[day];
        }
        if (changed) save();
    }

    function switchTab(tab) {
        currentTab = tab;
        const titles = { inventory:'Запасы', plan:'Меню', shopping:'Купить', history:'Аналитика' };
        document.getElementById('pageTitle').innerText = titles[tab];
        ['btnInv','btnPlan','btnShop','btnHist'].forEach(id => {
            const btn = document.getElementById(id);
            btn.classList.add('opacity-40');
            btn.classList.remove('text-blue-600');
        });
        const activeMap = { inventory:'btnInv', plan:'btnPlan', shopping:'btnShop', history:'btnHist' };
        document.getElementById(activeMap[tab]).classList.remove('opacity-40');
        document.getElementById(activeMap[tab]).classList.add('text-blue-600');
        render();
    }

    function render() {
        const container = document.getElementById('mainContent');
        container.innerHTML = '';
        document.getElementById('dateDisplay').innerHTML = new Date().toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
        if (currentTab === 'inventory') renderInventory(container);
        if (currentTab === 'plan') renderPlan(container);
        if (currentTab === 'shopping') renderShopping(container);
        if (currentTab === 'history') renderHistory(container);
        lucide.createIcons();
    }

    function groupInventoryItems() {
        const groups = new Map();
        inventory.filter(i => i.qty > 0).forEach(item => {
            if (inventorySearchQuery && !item.name.toLowerCase().includes(inventorySearchQuery.toLowerCase())) return;
            const key = `${item.name.trim().toLowerCase()}|${item.category}`;
            if (!groups.has(key)) {
                groups.set(key, {
                    displayName: item.name,
                    category: item.category,
                    items: [],
                    unitsSet: new Set(),
                    totalByUnit: new Map()
                });
            }
            const group = groups.get(key);
            group.items.push(item);
            group.unitsSet.add(item.unit);
            const prev = group.totalByUnit.get(item.unit) || 0;
            group.totalByUnit.set(item.unit, prev + item.qty);
        });
        return Array.from(groups.values()).map(group => {
            const hasMultipleUnits = group.unitsSet.size > 1;
            let totalDisplay = '';
            if (!hasMultipleUnits) {
                const unit = Array.from(group.unitsSet)[0];
                const totalQty = group.totalByUnit.get(unit);
                totalDisplay = `${totalQty} ${unit}`;
            } else {
                totalDisplay = 'разные ед.';
            }
            return {
                name: group.displayName,
                category: group.category,
                items: group.items,
                hasMultipleUnits,
                totalDisplay
            };
        }).sort((a,b) => {
            const idxA = categoryOrder.indexOf(a.category);
            const idxB = categoryOrder.indexOf(b.category);
            if (idxA !== idxB) return (idxA === -1 ? 999 : idxA) - (idxB === -1 ? 999 : idxB);
            return a.name.localeCompare(b.name);
        });
    }

    function renderInventory(container) {
        const searchWrapper = document.createElement('div');
        searchWrapper.className = 'search-wrapper';
        searchWrapper.innerHTML = `
            <input type="text" id="inventorySearch" class="search-input" placeholder="🔍 Поиск продуктов..." value="${escapeHtml(inventorySearchQuery)}">
            <span id="searchClear" class="search-clear" style="display: ${inventorySearchQuery ? 'flex' : 'none'};">✕</span>
        `;
        container.appendChild(searchWrapper);
        const searchInput = searchWrapper.querySelector('#inventorySearch');
        const clearBtn = searchWrapper.querySelector('#searchClear');
        
        const productContainer = document.createElement('div');
        productContainer.id = 'inventoryProductList';
        container.appendChild(productContainer);
        
        function refreshProductList() {
            const groups = groupInventoryItems();
            productContainer.innerHTML = '';
            if (groups.length === 0) {
                productContainer.innerHTML = `<div class="py-20 text-center opacity-40 text-[9px] font-bold uppercase">${inventorySearchQuery ? 'Ничего не найдено' : 'Нет продуктов'}</div>`;
                return;
            }
            let lastCat = '';
            let currentCategoryDiv = null;
            const isSearchActive = inventorySearchQuery.trim() !== '';
            
            for (const group of groups) {
                if (lastCat !== group.category) {
                    const catKey = group.category;
                    const catName = { мясо:'🥩 Мясо', курица:'🍗 Курица', рыба:'🐟 Рыба', овощи:'🥦 Овощи', фрукты:'🍎 Фрукты', 'п/ф':'🥟 П/Ф', зелень:'🌿 Зелень', выпечка:'🥐 Выпечка', кулинария:'🥗 Кулинария', другое:'📦 Разное' }[catKey] || 'Разное';
                    const shouldBeCollapsed = !isSearchActive && collapsedCategories[catKey] === true;
                    const wrapper = document.createElement('div');
                    wrapper.className = `category-wrapper ${shouldBeCollapsed ? 'collapsed-category' : ''}`;
                    const header = document.createElement('div');
                    header.className = `category-pill ${categoriesMap[catKey]} mt-1 flex items-center`;
                    header.innerHTML = `${catName} <span class="category-toggle-icon">▼</span>`;
                    header.onclick = (e) => {
                        e.stopPropagation();
                        if (!isSearchActive) {
                            collapsedCategories[catKey] = !collapsedCategories[catKey];
                            save();
                            refreshProductList();
                        }
                    };
                    const productsDiv = document.createElement('div');
                    productsDiv.className = 'category-products space-y-3';
                    wrapper.appendChild(header);
                    wrapper.appendChild(productsDiv);
                    productContainer.appendChild(wrapper);
                    currentCategoryDiv = productsDiv;
                    lastCat = group.category;
                }
                const card = document.createElement('div');
                card.className = 'scandi-card mb-3 overflow-hidden';
                const hasMany = group.items.length > 1;
                const headerDiv = document.createElement('div');
                headerDiv.className = 'inventory-header';
                headerDiv.innerHTML = `<span class="product-name">${escapeHtml(group.name)}</span><span class="total-badge">${group.totalDisplay}</span>`;
                card.appendChild(headerDiv);
                
                if (!hasMany) {
                    const item = group.items[0];
                    const isLow = item.qty <= (item.minQty || 1);
                    const row = document.createElement('div');
                    row.className = `single-location-row ${isLow ? 'bg-red-50/40' : ''}`;
                    row.innerHTML = `
                        <div class="flex items-center gap-2"><i data-lucide="map-pin" class="loc-icon"></i><span class="text-xs font-medium text-slate-600">${item.location}</span><span class="text-sm font-black ${isLow ? 'text-red-500' : 'text-slate-800'}">${item.qty} ${item.unit}</span>${isLow ? '<i data-lucide="alert-triangle" class="w-3 h-3 text-red-500 ml-1"></i>' : ''}</div>
                        <div class="flex gap-1">
                            <button class="action-btn p-1.5" onclick="event.stopPropagation(); openEditModal(${item.id})"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                            <button class="copy-btn p-1.5 rounded-lg" onclick="event.stopPropagation(); copyProduct(${item.id})"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                            <button class="action-btn-blue p-1.5 rounded-lg" onclick="event.stopPropagation(); addToPlanFromInv(${item.id})"><i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i></button>
                            <button class="move-btn p-1.5 rounded-lg" onclick="event.stopPropagation(); openMoveModal(${item.id})"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i></button>
                        </div>
                    `;
                    card.appendChild(row);
                } else {
                    const listDiv = document.createElement('div');
                    listDiv.className = 'pb-1';
                    for (const item of group.items) {
                        const isLow = item.qty <= (item.minQty || 1);
                        const row = document.createElement('div');
                        row.className = `multi-location-row ${isLow ? 'bg-red-50/30' : ''}`;
                        row.innerHTML = `
                            <div class="flex items-center gap-2"><i data-lucide="map-pin" class="loc-icon"></i><span class="text-xs font-medium text-slate-600 w-24">${item.location}</span><span class="text-sm font-black ${isLow ? 'text-red-500' : 'text-slate-800'}">${item.qty} ${item.unit}</span>${isLow ? '<i data-lucide="alert-triangle" class="w-3 h-3 text-red-500"></i>' : ''}</div>
                            <div class="flex gap-1">
                                <button class="action-btn p-1.5" onclick="event.stopPropagation(); openEditModal(${item.id})"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                                <button class="copy-btn p-1.5 rounded-lg" onclick="event.stopPropagation(); copyProduct(${item.id})"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                                <button class="action-btn-blue p-1.5 rounded-lg" onclick="event.stopPropagation(); addToPlanFromInv(${item.id})"><i data-lucide="calendar-plus" class="w-3.5 h-3.5"></i></button>
                                <button class="move-btn p-1.5 rounded-lg" onclick="event.stopPropagation(); openMoveModal(${item.id})"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i></button>
                            </div>
                        `;
                        listDiv.appendChild(row);
                    }
                    card.appendChild(listDiv);
                }
                if (currentCategoryDiv) currentCategoryDiv.appendChild(card);
            }
            lucide.createIcons();
        }
        
        let timeout = null;
        const handleSearch = () => {
            inventorySearchQuery = searchInput.value;
            clearBtn.style.display = inventorySearchQuery ? 'flex' : 'none';
            if (timeout) clearTimeout(timeout);
            timeout = setTimeout(() => refreshProductList(), 30);
        };
        searchInput.addEventListener('input', handleSearch);
        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            inventorySearchQuery = '';
            clearBtn.style.display = 'none';
            refreshProductList();
            searchInput.focus();
        });
        refreshProductList();

    function copyProduct(id) {
        const original = inventory.find(i => i.id === id);
        if (!original) return;
        document.getElementById('editItemId').value = '';
        document.getElementById('itemName').value = original.name;
        document.getElementById('itemQty').value = original.qty;
        document.getElementById('itemMinQty').value = original.minQty;
        document.getElementById('itemUnit').value = original.unit;
        document.getElementById('itemCat').value = original.category;
        document.getElementById('itemLoc').value = original.location;
        document.getElementById('itemDate').value = original.date || new Date().toISOString().split('T')[0];
        document.getElementById('deleteBtn').classList.add('hidden');
        toggleModal('itemModal', true);
        showToast('📋 Копия продукта — измените данные и сохраните');
    }

    function copyCurrentItem() {
        const id = document.getElementById('editItemId').value;
        if (!id) return;
        const original = inventory.find(i => i.id === parseInt(id));
        if (original) copyProduct(original.id);
    }

    function renderPlan(container) {
        container.innerHTML = `<div class="flex justify-between items-center mb-4"><h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">План на неделю</h2><button onclick="clearPlan()" class="text-[9px] font-bold uppercase text-red-400">Очистить</button></div><div class="space-y-3"></div>`;
        const planDiv = container.querySelector('.space-y-3');
        daysOrder.forEach(day => {
            const items = menuPlan[day] || [];
            const dayCard = document.createElement('div');
            dayCard.className = 'scandi-card p-4 day-card';
            dayCard.innerHTML = `<h3 class="font-black mb-2">${day}</h3><div class="space-y-1">${items.length ? items.map((it, idx) => `<div class="flex justify-between items-center text-sm bg-slate-50 p-2 rounded-xl"><span class="font-semibold">${escapeHtml(it.name)}</span><span class="text-xs text-red-500">-${it.deducted} ${it.unit}</span><div class="flex gap-1"><button onclick="consumePlanItem('${day}', ${idx})" class="text-emerald-600" title="Приготовлено, списать"><i data-lucide="check-circle" class="w-3.5 h-3.5"></i></button><button onclick="removeFromPlan('${day}', ${idx})" class="text-amber-600" title="Вернуть в запасы"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button></div></div>`).join('') : '<p class="text-[9px] text-slate-300 py-1">—</p>'}</div>`;
            planDiv.appendChild(dayCard);
        });
        lucide.createIcons();
    }

    function consumePlanItem(day, idx) {
        const planItem = menuPlan[day]?.[idx];
        if (!planItem) return;
        menuPlan[day].splice(idx, 1);
        if (menuPlan[day].length === 0) delete menuPlan[day];
        historyData.push({
            name: planItem.name,
            amount: -planItem.deducted,
            unit: planItem.unit,
            date: new Date().toISOString(),
            action: 'приготовлено'
        });
        save();
        render();
        showToast(`🍽️ ${planItem.name} приготовлено, списано ${planItem.deducted} ${planItem.unit}`);
    }

    function renderShopping(container) {
        const low = inventory.filter(i => i.qty > 0 && i.qty <= (i.minQty || 1));
        container.innerHTML = `<div class="flex items-center gap-2 mb-4"><i data-lucide="shopping-cart" class="w-4 h-4 text-red-500"></i><span class="text-[10px] font-black uppercase text-red-500">Критический список</span></div>`;
        if (!low.length) { container.innerHTML += `<div class="py-24 text-center opacity-30 text-[10px] font-bold uppercase">✅ Всё в порядке</div>`; return; }
        low.forEach(i => {
            const card = document.createElement('div');
            card.className = 'scandi-card p-3 mb-2 flex justify-between items-center border-l-4 border-l-red-400';
            card.innerHTML = `<div><p class="font-bold text-sm">${escapeHtml(i.name)}</p><p class="text-[9px] text-red-500">${i.qty} ${i.unit} · ${i.location}</p></div><button onclick="openEditModal(${i.id})" class="p-2 bg-slate-100 rounded-lg"><i data-lucide="plus" class="w-4 h-4"></i></button>`;
            container.appendChild(card);
        });
    }

    function renderHistory(container) {
        const totalPositions = inventory.filter(i => i.qty > 0).length;
        const deficitItems = inventory.filter(i => i.qty > 0 && i.qty <= (i.minQty || 1));
        const usage = {};
        historyData.forEach(l => usage[l.name] = (usage[l.name] || 0) + Math.abs(l.amount));
        const topUsed = Object.entries(usage).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—';
        
        // Группировка аналитики: Локация → Категория → Продукты
        const locMap = {};
        inventory.filter(i => i.qty > 0).forEach(i => {
            const loc = i.location || 'Без места';
            const cat = i.category || 'другое';
            if (!locMap[loc]) locMap[loc] = {};
            if (!locMap[loc][cat]) locMap[loc][cat] = [];
            locMap[loc][cat].push(i);
        });

        const categoryNames = {
            мясо:'🥩 Мясо',
            курица:'🍗 Курица',
            рыба:'🐟 Рыба',
            овощи:'🥦 Овощи',
            фрукты:'🍎 Фрукты',
            'п/ф':'🥟 П/Ф',
            зелень:'🌿 Зелень',
            выпечка:'🥐 Выпечка',
            кулинария:'🥗 Кулинария',
            другое:'📦 Разное'
        };

        const renderLocationAnalytics = () => {
            const locations = Object.keys(locMap).sort((a, b) => a.localeCompare(b));
            if (!locations.length) {
                return '<p class="text-[10px] text-slate-300">Нет продуктов</p>';
            }

            return locations.map(loc => {
                const locationCats = Object.keys(locMap[loc]);
                const orderedCats = [
                    ...categoryOrder.filter(cat => locationCats.includes(cat)),
                    ...locationCats.filter(cat => !categoryOrder.includes(cat)).sort((a, b) => a.localeCompare(b))
                ];

                return `
                    <div class="mb-4 last:mb-0">
                        <div class="flex items-center gap-1 mb-2">
                            <i data-lucide="map-pin" class="w-3 h-3 text-blue-500"></i>
                            <span class="text-[9px] font-black text-blue-600">${escapeHtml(loc)}</span>
                        </div>
                        <div class="pl-3 border-l space-y-3">
                            ${orderedCats.map(cat => `
                                <div>
                                    <div class="category-pill ${categoriesMap[cat] || 'pill-other'} mb-1">
                                        ${categoryNames[cat] || '📦 Разное'}
                                    </div>
                                    <div class="space-y-1">
                                        ${locMap[loc][cat]
                                            .sort((a, b) => a.name.localeCompare(b.name))
                                            .map(i => `
                                                <div class="flex justify-between text-xs gap-2">
                                                    <span class="truncate">${escapeHtml(i.name)}</span>
                                                    <span class="font-bold whitespace-nowrap">${i.qty} ${i.unit}</span>
                                                </div>
                                            `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        };

        container.innerHTML = `
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-3"><div class="stat-card p-4 bg-blue-600 text-white"><i data-lucide="box" class="w-4 h-4 mb-1 opacity-70"></i><p class="text-[9px] font-black uppercase">Позиций</p><p class="text-xl font-black">${totalPositions}</p></div><div class="stat-card p-4 bg-orange-500 text-white"><i data-lucide="flame" class="w-4 h-4 mb-1 opacity-70"></i><p class="text-[9px] font-black uppercase">Топ расхода</p><p class="text-sm font-black truncate">${escapeHtml(topUsed)}</p></div></div>
                <div class="stat-card p-4"><div class="flex items-center gap-2 mb-2"><div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div><span class="text-[9px] font-black uppercase text-slate-500">Дефицит (${deficitItems.length})</span></div><div class="max-h-48 overflow-y-auto space-y-1">${deficitItems.map(i => `<div class="flex justify-between text-xs py-1"><span class="font-medium">${escapeHtml(i.name)}</span><span class="text-red-500">${i.qty} ${i.unit}</span><span class="text-slate-400 text-[9px]">${i.location}</span></div>`).join('') || '<p class="text-[10px] text-slate-300">✨ Норма</p>'}</div></div>
                <div class="stat-card p-4"><h3 class="text-[9px] font-black text-slate-400 mb-3 uppercase">По местам</h3>${renderLocationAnalytics()}</div>
                <div class="stat-card p-4"><div class="flex flex-wrap gap-2 mb-3"><button onclick="exportData()" class="flex-1 py-2 bg-slate-100 rounded-lg text-[9px] font-bold">📤 Экспорт</button><button onclick="triggerImport()" class="flex-1 py-2 bg-slate-100 rounded-lg text-[9px] font-bold">📥 Импорт</button><button onclick="clearHistory()" class="w-full py-2 text-red-500 text-[9px] font-bold">🗑 Очистить историю</button></div><div id="historyLogs" class="space-y-2 max-h-48 overflow-y-auto"></div></div>
            </div>`;
        const logsDiv = document.getElementById('historyLogs');
        [...historyData].reverse().slice(0, 12).forEach(log => {
            const sign = log.amount > 0 ? `+${log.amount}` : `${log.amount}`;
            const dateStr = new Date(log.date).toLocaleDateString('ru-RU', { day:'numeric', month:'short' });
            logsDiv.innerHTML += `<div class="flex justify-between text-[10px] border-b py-1"><span>${escapeHtml(log.name)}</span><span class="font-black text-red-500">${sign} ${log.unit}</span><span class="text-slate-300">${dateStr}</span></div>`;
        });
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    function startVoiceRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { showToast("Голосовой ввод не поддерживается", true); return; }
        const rec = new SpeechRecognition();
        rec.lang = 'ru-RU';
        const btn = document.getElementById('voiceBtn');
        rec.onstart = () => btn.classList.add('voice-active');
        rec.onresult = e => { document.getElementById('itemName').value = e.results[0][0].transcript; showToast(`🎤 "${e.results[0][0].transcript}"`); };
        rec.onend = () => btn.classList.remove('voice-active');
        rec.start();
    }

    function toggleModal(id, show) { const m = document.getElementById(id); const o = document.getElementById('modalOverlay'); if (show) { o.classList.remove('hidden'); setTimeout(() => m.classList.add('modal-active'), 10); } else { m.classList.remove('modal-active'); setTimeout(() => o.classList.add('hidden'), 250); } }
    function closeAllModals() { toggleModal('itemModal', false); toggleModal('planModal', false); toggleModal('moveModal', false); pendingPlanItemId = null; }
    function openAddModal() { 
        document.getElementById('editItemId').value = ''; 
        document.getElementById('itemName').value = ''; 
        document.getElementById('itemQty').value = 1; 
        document.getElementById('itemMinQty').value = 1; 
        document.getElementById('itemDate').valueAsDate = new Date(); 
        document.getElementById('deleteBtn').classList.add('hidden'); 
        toggleModal('itemModal', true); 
    }
    function openEditModal(id) { 
        const i = inventory.find(i=>i.id===id); 
        if(!i) return; 
        document.getElementById('editItemId').value=i.id; 
        document.getElementById('itemName').value=i.name; 
        document.getElementById('itemQty').value=i.qty; 
        document.getElementById('itemMinQty').value=i.minQty||1; 
        document.getElementById('itemUnit').value=i.unit; 
        document.getElementById('itemCat').value=i.category; 
        document.getElementById('itemLoc').value=i.location; 
        document.getElementById('itemDate').value=i.date; 
        document.getElementById('deleteBtn').classList.remove('hidden'); 
        toggleModal('itemModal', true); 
    }
    function saveItem() { 
        const id = document.getElementById('editItemId').value; 
        const data = { 
            id: id ? parseInt(id) : Date.now(), 
            name: document.getElementById('itemName').value.trim() || 'Продукт', 
            qty: parseFloat(document.getElementById('itemQty').value) || 0, 
            minQty: parseFloat(document.getElementById('itemMinQty').value) || 1, 
            unit: document.getElementById('itemUnit').value, 
            category: document.getElementById('itemCat').value, 
            location: document.getElementById('itemLoc').value, 
            date: document.getElementById('itemDate').value || new Date().toISOString().split('T')[0] 
        }; 
        if (id) { const idx = inventory.findIndex(i=>i.id===parseInt(id)); inventory[idx]=data; } 
        else inventory.push(data); 
        save(); closeAllModals(); cleanupOrphanPlanItems(); render(); showToast('✅ Сохранено'); 
    }
    function deleteCurrentItem() { 
        const id = parseInt(document.getElementById('editItemId').value); 
        inventory = inventory.filter(i=>i.id!==id); 
        save(); cleanupOrphanPlanItems(); closeAllModals(); render(); showToast('Удалено'); 
    }
    function addToPlanFromInv(id) { 
        const item = inventory.find(i=>i.id===id); 
        if(!item||item.qty<=0) { showToast('Недостаточно', true); return; } 
        pendingPlanItemId=item.id; 
        const def = (item.unit==='г'||item.unit==='мл')?100:1; 
        document.getElementById('planQtyDeduct').value = Math.min(def, item.qty); 
        document.getElementById('planUnitLabel').innerText=item.unit; 
        document.getElementById('planSource').innerHTML = `<div class="p-3 bg-slate-50 rounded-xl"><p class="font-bold">${escapeHtml(item.name)}</p><p class="text-[9px] text-slate-500">Доступно: ${item.qty} ${item.unit}</p><p class="text-[8px] text-slate-400">${item.location}</p></div>`; 
        toggleModal('planModal', true); 
    }
    function confirmAddToPlan() { 
        if(!pendingPlanItemId) return; 
        const item=inventory.find(i=>i.id===pendingPlanItemId); 
        if(!item) { showToast('Ошибка',true); closeAllModals(); return; } 
        const day=document.getElementById('planDay').value; 
        const ded=parseFloat(document.getElementById('planQtyDeduct').value); 
        if(isNaN(ded)||ded<=0||ded>item.qty) { showToast('Некорректное количество',true); return; } 
        item.qty = parseFloat((item.qty-ded).toFixed(3)); 
        if(!menuPlan[day]) menuPlan[day]=[]; 
        menuPlan[day].push({name:item.name, itemId:item.id, deducted:ded, unit:item.unit}); 
        historyData.push({name:item.name, amount:-ded, unit:item.unit, date:new Date().toISOString(), action:'запланировано'}); 
        save(); closeAllModals(); render(); showToast(`📅 ${item.name} запланирован`); 
    }
    function removeFromPlan(day, idx) { 
        const p = menuPlan[day]?.[idx]; 
        if(!p) return; 
        const inv = inventory.find(i=>i.id===p.itemId); 
        if(inv) { inv.qty = parseFloat((inv.qty+p.deducted).toFixed(3)); historyData.push({name:p.name, amount:p.deducted, unit:p.unit, date:new Date().toISOString(), action:'возврат'}); showToast(`↩️ Возврат ${p.deducted} ${p.unit}`); } 
        menuPlan[day].splice(idx,1); 
        if(menuPlan[day].length===0) delete menuPlan[day]; 
        save(); render(); 
    }
    function clearPlan() { if(confirm('Сбросить меню?')) { menuPlan={}; save(); render(); showToast('Меню очищено'); } }
    function clearHistory() { if(confirm('Удалить историю?')) { historyData=[]; save(); render(); showToast('История очищена'); } }
    function exportData() { const d = { inventory, historyData, menuPlan }; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'})); a.download=`scandi_${Date.now()}.json`; a.click(); showToast('Экспорт готов'); }
    function triggerImport() { document.getElementById('importInput').click(); }
    function handleImport(e) { const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); inventory=d.inventory ||[]; historyData=d.historyData ||[]; menuPlan=d.menuPlan ||{}; save(); cleanupOrphanPlanItems(); render(); showToast('Импорт выполнен'); } catch(e){ showToast('Ошибка файла',true); } }; r.readAsText(f); }

    // Улучшенные функции перемещения (без дублирования)
    function openMoveModal(itemId) {
        const item = inventory.find(i => i.id === itemId);
        if (!item) return;
        document.getElementById('moveItemId').value = item.id;
        document.getElementById('moveProductName').innerText = item.name;
        document.getElementById('moveFromLoc').innerText = item.location;
        document.getElementById('moveAvailableQty').innerHTML = `${item.qty} ${item.unit}`;
        document.getElementById('moveQty').value = item.qty;
        // Исключаем текущую локацию из выбора
        const targetSelect = document.getElementById('moveTargetLoc');
        for (let opt of targetSelect.options) {
            opt.disabled = (opt.value === item.location);
        }
        toggleModal('moveModal', true);
    }

    function moveAllQuantity() {
        const moveQtyInput = document.getElementById('moveQty');
        const availableSpan = document.getElementById('moveAvailableQty');
        const qtyMatch = availableSpan.innerText.match(/^([\d\.]+)/);
        if (qtyMatch) {
            moveQtyInput.value = parseFloat(qtyMatch[1]);
        }
        confirmMove();
    }

    function confirmMove() {
        const itemId = parseInt(document.getElementById('moveItemId').value);
        const sourceItem = inventory.find(i => i.id === itemId);
        if (!sourceItem) { showToast("Продукт не найден", true); closeAllModals(); return; }
        
        let moveQty = parseFloat(document.getElementById('moveQty').value);
        const targetLoc = document.getElementById('moveTargetLoc').value;
        
        if (isNaN(moveQty) || moveQty <= 0) { showToast("Введите корректное количество", true); return; }
        if (moveQty > sourceItem.qty) { showToast("Нельзя переместить больше, чем есть", true); return; }
        if (targetLoc === sourceItem.location) { showToast("Целевая локация совпадает с текущей", true); return; }
        
        // Ищем продукт в целевой локации с таким же именем, категорией и единицей (без учёта регистра)
        const targetItem = inventory.find(i => 
            i.name.toLowerCase() === sourceItem.name.toLowerCase() &&
            i.category === sourceItem.category &&
            i.unit === sourceItem.unit &&
            i.location === targetLoc
        );
        
        // Уменьшаем исходный продукт
        sourceItem.qty = parseFloat((sourceItem.qty - moveQty).toFixed(3));
        
        if (targetItem) {
            // Объединяем: увеличиваем количество в целевой локации
            targetItem.qty = parseFloat((targetItem.qty + moveQty).toFixed(3));
            // Если у целевого нет даты, возьмём из исходного (или оставим свою)
            if (!targetItem.date && sourceItem.date) targetItem.date = sourceItem.date;
            // Минимальный порог: возьмём наименьший (чтобы раньше сигнализировать о дефиците)
            targetItem.minQty = Math.min(targetItem.minQty || 1, sourceItem.minQty || 1);
        } else {
            // Создаём новую запись в целевой локации, копируя все параметры
            inventory.push({
                id: Date.now(),
                name: sourceItem.name,
                qty: moveQty,
                minQty: sourceItem.minQty,
                unit: sourceItem.unit,
                category: sourceItem.category,
                location: targetLoc,
                date: sourceItem.date || new Date().toISOString().split('T')[0]
            });
        }
        
        // Если исходный продукт обнулился, удаляем его
        if (sourceItem.qty <= 0.0001) {
            inventory = inventory.filter(i => i.id !== sourceItem.id);
        }
        
        save();
        closeAllModals();
        render();
        showToast(`🔄 Перемещено ${moveQty} ${sourceItem.unit} из ${sourceItem.location} в ${targetLoc}`);
    }

    document.addEventListener('keydown', e=>{if(e.key==='Escape') closeAllModals();});
    cleanupOrphanPlanItems();
    render();
</script>
</body>
</html>
